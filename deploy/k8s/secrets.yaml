# Task 40: secrets come ONLY from the external secret manager, never from git.
#
# The ExternalSecret below (external-secrets.io) syncs remote keys into the
# in-cluster Secret dubbing-secrets, which Deployments consume via
# valueFrom.secretKeyRef (see api-deployment.yaml / workers-*.yaml).
#
# Operator prerequisites (one-time per cluster):
#   1. Install external-secrets (https://external-secrets.io).
#   2. Create a ClusterSecretStore named dubbing-cluster-store pointing at the
#      manager (Azure Key Vault / AWS Secrets Manager / HashiCorp Vault).
#      Example for Azure Key Vault:
#        apiVersion: external-secrets.io/v1
#        kind: ClusterSecretStore
#        metadata: {name: dubbing-cluster-store}
#        spec:
#          provider:
#            azurekv:
#              vaultUrl: https://dubbing-prod-kv.CHANGE_ME.vault.azure.net/
#              authType: WorkloadIdentity
#   3. Populate these remote keys (names under remoteRef.remoteKey):
#        connection-string        - managed PostgreSQL 16 ADO.NET string
#        maintenance-connection   - maintenance/BYPASSRLS role string (sweeps/migrations)
#        rabbitmq-host            - broker host (e.g. rabbitmq.prod.svc or managed host)
#        rabbitmq-port            - broker port (5672)
#        rabbitmq-vhost           - virtual host (/)
#        rabbitmq-username        - broker username
#        rabbitmq-password        - broker password
#        redis-connection         - Redis 7 connection (host:port[,password])
#        storage-endpoint         - S3-compatible endpoint URL
#        storage-bucket           - bucket name
#        storage-access-key       - object storage access key
#        storage-secret-key       - object storage secret key
#        auth-signing-key         - JWT HMAC signing key (>= 32 bytes, rotate per secret-rotation.md)
#        providers-azure-api-key  - Providers:AzureApiKey
#        azure-speech-key         - Azure:SpeechKey
#        azure-translator-key     - Azure:TranslatorKey
#        openai-api-key           - OpenAI:ApiKey AND Providers:OpenAIApiKey
#        google-api-key           - Google:ApiKey AND Providers:GoogleApiKey
#        keda-rabbitmq-host       - AMQP URI for the KEDA rabbitmq scaler
#                                  (e.g. amqp://user:pass@host:5672/vhost)
#        keda-postgres-conn       - PostgreSQL connection string for the KEDA
#                                  postgresql scaler (active-leases query)
#   4. TLS for ingress is provisioned by cert-manager (see ingress.yaml);
#      mTLS client material (Security:MtlsEnabled) is mounted from the same
#      manager at /certs, never baked into images (see docs/security/mtls.md).
#
# Rotation: follow docs/security/secret-rotation.md (dual-support window, then
# `kubectl rollout restart` per workload; readiness gates move traffic only to
# healthy pods).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dubbing-secrets
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dubbing-cluster-store
  target:
    name: dubbing-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: connection-string
      remoteRef: {key: connection-string}
    - secretKey: maintenance-connection
      remoteRef: {key: maintenance-connection}
    - secretKey: rabbitmq-host
      remoteRef: {key: rabbitmq-host}
    - secretKey: rabbitmq-port
      remoteRef: {key: rabbitmq-port}
    - secretKey: rabbitmq-vhost
      remoteRef: {key: rabbitmq-vhost}
    - secretKey: rabbitmq-username
      remoteRef: {key: rabbitmq-username}
    - secretKey: rabbitmq-password
      remoteRef: {key: rabbitmq-password}
    - secretKey: redis-connection
      remoteRef: {key: redis-connection}
    - secretKey: storage-endpoint
      remoteRef: {key: storage-endpoint}
    - secretKey: storage-bucket
      remoteRef: {key: storage-bucket}
    - secretKey: storage-access-key
      remoteRef: {key: storage-access-key}
    - secretKey: storage-secret-key
      remoteRef: {key: storage-secret-key}
    - secretKey: auth-signing-key
      remoteRef: {key: auth-signing-key}
    - secretKey: providers-azure-api-key
      remoteRef: {key: providers-azure-api-key}
    - secretKey: azure-speech-key
      remoteRef: {key: azure-speech-key}
    - secretKey: azure-translator-key
      remoteRef: {key: azure-translator-key}
    - secretKey: openai-api-key
      remoteRef: {key: openai-api-key}
    - secretKey: google-api-key
      remoteRef: {key: google-api-key}
    - secretKey: keda-rabbitmq-host
      remoteRef: {key: keda-rabbitmq-host}
    - secretKey: keda-postgres-conn
      remoteRef: {key: keda-postgres-conn}

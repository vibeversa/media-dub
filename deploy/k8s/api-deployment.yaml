# Task 40: API deployment (prod: 3 replicas) + ClusterIP Service.
# Image org/tag are pinned per environment by the kustomize overlays
# (deploy/k8s/overlays/*/kustomization.yaml `images:`); replace CHANGE_ME.
#
# NAMED `dubbing-api`, NOT `api` (Task 043B)
# -----------------------------------------
# Every operator command for this workload is `kubectl ... rollout <verb>
# deployment/dubbing-api` - undo, history, status, restart. A Deployment named
# `api` is one character-suffix away from every other `api` object in a shared
# namespace, and the object this repository most often has to move backwards is
# the one whose name collides. It also matches the image name
# (`ghcr.io/CHANGE_ME/dubbing-api`) and the public hostname
# (`api.dubbing.example.com`), so the name, the artefact and the DNS name are
# one word instead of three.
#
# Renaming is not free and the rename was done with the references, not around
# them: the Service and the Ingress in this file, `ingress.yaml`,
# `overlays/*/kustomization.yaml` (`replicas:`), `overlays/staging/
# ingress-patch.yaml`, and every `deploy/api` in a runbook. The `app.kubernetes
# .io/component: api` LABEL is deliberately unchanged - it is what the
# NetworkPolicies and the PodDisruptionBudget select on, and a label rename is
# a selector migration with no benefit at all.
# Task 043 (R3): readiness asserts MIGRATION CURRENCY as well as database
# reachability, via `MigrationCurrencyCheck` in HealthRegistration. A pod whose
# build knows migrations the schema does not have is not ready, so it never
# receives traffic. That is what turns a botched rollout from "a 500 on the first
# request that touches a new column" into "the pod is not in the Service".
#
# Liveness stays `/health/live` and stays process-only. A liveness probe that
# depended on PostgreSQL would restart every pod during a database blip, turning
# a degradation into an outage — the exact failure the live/ready split exists to
# prevent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dubbing-api
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
    app.kubernetes.io/component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dubbing-platform
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Migration gate: block API rollout until pending EF migrations are
        # applied. Runs the same idempotent EF bundle as the migration Job
        # (migration-job.yaml) via the maintenance image: concurrent runners
        # serialize on __EFMigrationsHistory, an up-to-date database exits 0
        # immediately, and a broken migration exits non-zero so the pod never
        # starts and the rollout blocks. Deploy order still runs the migration
        # Job first (see deploy/README.md); this is defense-in-depth for
        # out-of-band applies. Uses the maintenance-role connection string
        # (BYPASSRLS), never the app role, per
        # src/DubbingPlatform.Infrastructure/Persistence/MIGRATION_NOTES.md.
        - name: wait-for-migrations
          image: ghcr.io/CHANGE_ME/dubbing-maintenance:latest
          imagePullPolicy: Always
          env:
            # The EF bundle is built from the Api startup project, so it reads
            # the same ConnectionStrings__Default key as the app. Wired to the
            # maintenance-role string (BYPASSRLS); the bundle redacts it from
            # logs.
            - name: ConnectionStrings__Default
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: maintenance-connection}}
            - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
              value: /tmp/bundle
          command: [/app/efbundle]
          args: [--verbose]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1654
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: api
          image: ghcr.io/CHANGE_ME/dubbing-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: dubbing-config}
          env:
            - name: ConnectionStrings__Default
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: connection-string}}
            - name: RabbitMq__Host
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-host}}
            - name: RabbitMq__Port
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-port}}
            - name: RabbitMq__VirtualHost
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-vhost}}
            - name: RabbitMq__Username
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-username}}
            - name: RabbitMq__Password
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-password}}
            - name: Redis__Connection
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: redis-connection}}
            - name: Storage__Endpoint
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-endpoint}}
            - name: Storage__Bucket
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-bucket}}
            - name: Storage__AccessKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-access-key}}
            - name: Storage__SecretKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-secret-key}}
            - name: Auth__SigningKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: auth-signing-key}}
            - name: Providers__AzureApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: providers-azure-api-key}}
            - name: Azure__SpeechKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: azure-speech-key}}
            - name: Azure__TranslatorKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: azure-translator-key}}
            - name: OpenAI__ApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: openai-api-key}}
            - name: Providers__OpenAIApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: openai-api-key}}
            - name: Google__ApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: google-api-key}}
            - name: Providers__GoogleApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: google-api-key}}
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1654
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dubbing-api
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8080

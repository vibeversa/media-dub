# Task 40: AI provider worker (diarization, transcription, context,
# translation, voice assignment, QC). Prod: 3 replicas. Scales on
# ai.provider queue length 100 (+ CPU fallback, see keda-scalers.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ai
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
    app.kubernetes.io/component: worker-ai
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: worker-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dubbing-platform
        app.kubernetes.io/component: worker-ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/CHANGE_ME/dubbing-worker-ai:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef: {name: dubbing-config}
          env:
            - {name: DOTNET_WORKER_ROLE, value: ai}
            - name: ConnectionStrings__Default
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: connection-string}}
            - name: RabbitMq__Host
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-host}}
            - name: RabbitMq__Port
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-port}}
            - name: RabbitMq__VirtualHost
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-vhost}}
            - name: RabbitMq__Username
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-username}}
            - name: RabbitMq__Password
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-password}}
            - name: Redis__Connection
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: redis-connection}}
            - name: Storage__Endpoint
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-endpoint}}
            - name: Storage__Bucket
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-bucket}}
            - name: Storage__AccessKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-access-key}}
            - name: Storage__SecretKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-secret-key}}
            - name: Providers__AzureApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: providers-azure-api-key}}
            - name: Azure__SpeechKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: azure-speech-key}}
            - name: Azure__TranslatorKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: azure-translator-key}}
            - name: OpenAI__ApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: openai-api-key}}
            - name: Providers__OpenAIApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: openai-api-key}}
            - name: Google__ApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: google-api-key}}
            - name: Providers__GoogleApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: google-api-key}}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1654
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}

# The static frontend origin (Task 043A, instruction 2; moved here from
# deploy/k8s/static-deployment.yaml, which Task 043A supersedes, and split into
# the four manifests this directory holds).
#
# WHY A DEPLOYMENT AND NOT "THE CDN SERVES index.html"
# -----------------------------------------------------
# A CDN caches, it does not originate. Something has to hold the bytes, and that
# something is an origin. This is it: the `Dockerfile.frontend` image, which
# serves `frontend/dist` through nginx with the cache and header policy in
# `deploy/nginx/default.conf`.
#
# THE REQUEST PATH
# ----------------
#   Browser -> CDN (caches, terminates the public hostname) -> ingress-nginx
#   (terminates TLS for the origin hostname) -> these pods -> API (separate host)
#
# `CHANGE_ME` in the image tag is replaced by the kustomize overlays (see
# deploy/k8s/overlays/*/kustomization.yaml `images:`), exactly as for the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
    app.kubernetes.io/component: static
spec:
  # Two, not three. The origin is a file server: it has no database, no broker
  # and no in-flight work, so a pod being slow is a node problem, and a third
  # replica is capacity for a workload that cannot be slow. Two is the smallest
  # number that survives a node drain without a CDN 5xx.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # 0, not 1. The two replicas serve identical bytes from the same image, so
      # there is no reason to ever have fewer than two - and a rollout that dips
      # to one is a rollout with a single point of failure inside it.
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: static
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dubbing-platform
        app.kubernetes.io/component: static
    spec:
      securityContext:
        runAsNonRoot: true
        # 101 is the nginx-unprivileged image's own uid. The image declares
        # `USER nginx` and cannot bind below 1024, so the pod must not try to
        # grant it capabilities the image was built to avoid needing.
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: ghcr.io/CHANGE_ME/dubbing-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # /healthz, NOT /index.html. The probe's job is "can this process serve
          # an HTTP response", and asking for the document conflates that with
          # "does the build output contain an index.html" - so a build that
          # produced no document is a failing readiness probe that reads as a
          # broken pod rather than as a broken build. /healthz is a static 200
          # from the origin config and has no such dependency. The distinction
          # matters on exactly the morning somebody changes the build.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            # Small on purpose: nginx serving pre-compressed static files is
            # IO-bound, and the CPU request exists to place the pod on a node
            # that will not be evicted first. 32Mi is the floor the unprivileged
            # image needs for its own buffers.
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities: {drop: [ALL]}
          # NO envFrom, NO env, NO volume from frontend-build-config.
          #
          # `VITE_*` values are inlined into the bundle by Vite at BUILD time, so
          # setting one in a ConfigMap at runtime cannot change a single byte of
          # the JavaScript the browser downloads. Mounting it into the pod would
          # be worse than useless: it would be a ConfigMap that reads like
          # configuration, is not read by anything, and is changed by operators
          # who then observe no effect. The ConfigMap
          # (deploy/k8s/frontend/configmap.yaml) is therefore the *build input*
          # record consumed by the release pipeline before the image is built -
          # see deploy/frontend/README.md, "Env injection: build-arg, not
          # runtime". The only runtime configuration this container has is nginx
          # reading its own conf.d, and the only file it writes is /tmp.
          volumeMounts:
            # nginx-unprivileged writes its pid, temp files and the access/error
            # log targets under /tmp. With a read-only root that directory must
            # be writable, or the container fails to start with a message that
            # names the pid file rather than the policy.
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}

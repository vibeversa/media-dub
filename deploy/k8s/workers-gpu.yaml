# Task 40: GPU worker (GPU-backed TTS / local inference).
# Task 43: completed local-inference boundary. Base replicas: 0, so clusters
# WITHOUT GPU nodes schedule nothing and report no error. KEDA scales 0->4 on
# ai.gpu queue depth + DCGM GPU utilization (see keda-scalers.yaml).
# Scheduling is pinned to GPU nodes: nodeSelector + NoSchedule toleration +
# nvidia.com/gpu:1 limit (requires the NVIDIA device plugin + GPU node pool;
# the NVIDIA container runtime is provided by the node, per
# Dockerfile.worker.gpu). Local inference is disabled by default
# (Features:LocalInferenceEnabled=false); enabling requires setting the flag
# plus LocalInference__Endpoint. Per-worker concurrency
# LocalInference__MaxConcurrency=1 on GPU (2 on CPU) is enforced by the
# adapter semaphore; WarmupAsync (POST /warmup, fallback GET /health) gates
# readiness via the local-inference-warmup check when the flag is true.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-gpu
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
    app.kubernetes.io/component: worker-gpu
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: worker-gpu
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dubbing-platform
        app.kubernetes.io/component: worker-gpu
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/CHANGE_ME/dubbing-worker-gpu:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef: {name: dubbing-config}
          env:
            - {name: DOTNET_WORKER_ROLE, value: gpu}
            - {name: NVIDIA_VISIBLE_DEVICES, value: all}
            - {name: LocalInference__Device, value: cuda}
            - {name: LocalInference__Endpoint, value: "http://local-inference:8000"}
            - {name: LocalInference__Protocol, value: http}
            - {name: LocalInference__MaxConcurrency, value: "1"}
            - name: ConnectionStrings__Default
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: connection-string}}
            - name: RabbitMq__Host
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-host}}
            - name: RabbitMq__Port
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-port}}
            - name: RabbitMq__VirtualHost
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-vhost}}
            - name: RabbitMq__Username
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-username}}
            - name: RabbitMq__Password
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: rabbitmq-password}}
            - name: Redis__Connection
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: redis-connection}}
            - name: Storage__Endpoint
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-endpoint}}
            - name: Storage__Bucket
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-bucket}}
            - name: Storage__AccessKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-access-key}}
            - name: Storage__SecretKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: storage-secret-key}}
            - name: Providers__AzureApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: providers-azure-api-key}}
            - name: OpenAI__ApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: openai-api-key}}
            - name: Providers__OpenAIApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: openai-api-key}}
            - name: Google__ApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: google-api-key}}
            - name: Providers__GoogleApiKey
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: google-api-key}}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1654
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}

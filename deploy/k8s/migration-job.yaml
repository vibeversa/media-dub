# Task 40: database migration Job. Task 043 (R5): this is the ORDERING half of
# migration-job-before-API, and the annotations are what enforce it.
#
#   - ArgoCD: PreSync hook (below). ArgoCD refuses to sync the rest of the
#     application until every PreSync hook reports Healthy, so a failed migration
#     blocks the API rollout by construction rather than by procedure.
#   - Helm: pre-upgrade hook (below), same guarantee.
#   - Plain kubectl: DELETE any previous Job, apply this file, then WAIT
#     (kubectl delete job dubbing-migration -n <ns> --ignore-not-found
#      kubectl apply -f deploy/k8s/migration-job.yaml
#      kubectl wait --for=condition=complete job/dubbing-migration -n <ns>),
#     then roll out the API. The wait is the gate; the apply alone is not.
#     See deploy/rollout.md §1 and docs/rollout.md §2.
#
# WHY THE DELETE IS PART OF THE ORDERING, NOT AN OPTIONAL PRECLEAN
# ---------------------------------------------------------------
# A Job's `spec` is immutable, so `kubectl apply -f` against a Job that already
# COMPLETED is a no-op that exits 0, and the completed condition from the
# PREVIOUS release is still there. `kubectl wait --for=condition=complete`
# therefore returns success immediately, having observed a migration that ran
# against a schema state nobody is in any more. That is a false pass on the one
# gate R1 depends on, and it is silent: the wait prints the Job's name and
# nothing else.
#
# ArgoCD and Helm are not exposed to it - `BeforeHookCreation` /
# `before-hook-creation` delete the previous object before creating the new one -
# so this is specifically the plain-`kubectl` path. `deploy/rollout/
# rehearse-rollback.sh` demonstrates the false pass and then the fix, and
# `scripts/check-rollout-window.mjs` asserts the delete is in the documented
# order.
#
# A failed migration leaves the PREVIOUS release serving. It does not roll the
# schema back: migrations are additive only (expand/contract, deploy/rollout.md
# §2), and reversing a migration that applied anywhere shared is how data is
# lost. Forward-fix.
#
# Mechanism: the maintenance image ships a self-contained EF migrations bundle at
# /app/efbundle (built in Dockerfile.maintenance via `dotnet ef migrations
# bundle`, i.e. the compiled form of `dotnet ef database update --project
# src/DubbingPlatform.Infrastructure --startup-project src/DubbingPlatform.Api
# --context AppDbContext`). The bundle is idempotent (concurrent runners
# serialize on __EFMigrationsHistory) and uses the maintenance-role connection
# string (BYPASSRLS), never the app role.
#
# Least privilege: this Pod is the ONLY thing in the platform that can DDL, and
# `migration-allow` in networkpolicies.yaml restricts its egress to PostgreSQL.
# It has no ingress rule at all, no broker credential, no object-store
# credential, and `readOnlyRootFilesystem` with all capabilities dropped. Its
# connection string arrives from the ExternalSecret as `maintenance-connection`
# - never from a literal in this file, and never as the app role.
#
# NETWORK: `migration-allow` in networkpolicies.yaml restricts this Job's egress
# to PostgreSQL. Before Task 043 it was swept in by `workers-allow`, which also
# granted it the broker and Redis.
apiVersion: batch/v1
kind: Job
metadata:
  name: dubbing-migration
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dubbing-platform
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: ghcr.io/CHANGE_ME/dubbing-maintenance:latest
          imagePullPolicy: Always
          env:
            # Bundle is built from the Api startup project: same
            # ConnectionStrings__Default key as the app, wired to the
            # maintenance-role string. Redacted from bundle logs.
            - name: ConnectionStrings__Default
              valueFrom: {secretKeyRef: {name: dubbing-secrets, key: maintenance-connection}}
            - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
              value: /tmp/bundle
          command: [/app/efbundle]
          args: [--verbose]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1654
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}

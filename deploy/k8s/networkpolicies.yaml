# Task 40: NetworkPolicies implementing the Task 37 / docs/security/mtls.md
# spec: default deny-all + explicit allows. Workers accept no ingress.
# Backend selectors below cover BOTH self-hosted staging statefulsets (labels
# app=postgres|rabbitmq|redis|minio) and in-cluster proxies; managed prod
# endpoints are reached via the documented ipBlock CIDRs (CHANGE_ME to the
# real managed ranges) plus the provider-allowlist egress on 443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Cluster DNS must work before anything else can resolve.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# api: served by ingress-nginx, scraped by monitoring, talks to backends.
#
# R4 (Task 043): the API's ingress is the ONLY path from outside the cluster to
# anything in it. Two rules here are load-bearing and both fail silently when
# broken:
#
#   * every ingress peer MUST be a namespaceSelector. A bare `podSelector`
#     matches pods in THIS namespace, so a peer written that way admits every
#     workload deployed alongside the API - which is "the static origin, the
#     workers, and anything an attacker can schedule".
#   * no `ipBlock` on ingress. An ipBlock admits traffic from outside the
#     cluster by address, which is the same reach the ingress-nginx namespace
#     already grants, without the ability to name it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: api}
  policyTypes: [Ingress, Egress]
  ingress:
    # The CDN egress/edge proxies and the ingress controller. Both are
    # namespaceSelector because both are namespaced workloads.
    - from:
        - namespaceSelector: {matchLabels: {name: ingress-nginx}}
        - namespaceSelector: {matchLabels: {name: cdn-edge}}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector: {matchLabels: {name: monitoring}}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector: {matchLabels: {app: postgres}}
        - podSelector: {matchLabels: {app: rabbitmq}}
        - podSelector: {matchLabels: {app: redis}}
        - podSelector: {matchLabels: {app: minio}}
        - ipBlock: {cidr: 198.51.100.0/24} # CHANGE_ME: managed PG CIDR
        - ipBlock: {cidr: 203.0.113.0/24} # CHANGE_ME: managed broker/Redis CIDR
        - ipBlock: {cidr: 192.0.2.0/24} # CHANGE_ME: managed object-storage CIDR
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 5672}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443} # provider allowlist (ProviderEndpointValidator hosts); clusters with Cilium should replace with toFQDNs rules
---
# Workers: no ingress (default-deny ingress stays); same backend egress as
# the API. Selector excludes the api component (covered by api-allow above).
#
# It also EXCLUDES `migration` and `static`, and each exclusion has its own
# policy below. That is the whole point: `NotIn [api]` alone swept the migration
# Job in with the workers, handing a database migration job broker and Redis
# access it has no reason to have. A migration that can publish to the queue is
# a migration that can enqueue work during a deploy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workers-allow
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/part-of, operator: In, values: [dubbing-platform]}
      - {key: app.kubernetes.io/component, operator: NotIn, values: [api, migration, static]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: postgres}}
        - podSelector: {matchLabels: {app: rabbitmq}}
        - podSelector: {matchLabels: {app: redis}}
        - podSelector: {matchLabels: {app: minio}}
        - ipBlock: {cidr: 198.51.100.0/24} # CHANGE_ME: managed PG CIDR
        - ipBlock: {cidr: 203.0.113.0/24} # CHANGE_ME: managed broker/Redis CIDR
        - ipBlock: {cidr: 192.0.2.0/24} # CHANGE_ME: managed object-storage CIDR
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 5672}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443} # provider allowlist; see note above
---
# The migration Job (Task 043, R4 + least privilege).
#
# It runs `/app/efbundle` against PostgreSQL and does nothing else. Before
# Task 043 it inherited `workers-allow`'s egress, which also granted it the
# broker (5672), Redis (6379) and object storage (9000). A migration with broker
# access can publish, and a migration that publishes during a deploy is a
# message delivered against a schema mid-change.
#
# PostgreSQL only, plus DNS (already allowed by `allow-dns-egress`). No ingress:
# nothing connects to a Job that is applying a migration.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migration-allow
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
  annotations:
    task-043: "least-privilege DB role and egress for the migration Job"
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: migration}
  policyTypes: [Egress]
  egress:
    # Self-hosted staging PostgreSQL. In prod the endpoint is the managed CIDR
    # (CHANGE_ME below); both are listed so the Job works in either topology.
    - to:
        - podSelector: {matchLabels: {app: postgres}}
        - ipBlock: {cidr: 198.51.100.0/24} # CHANGE_ME: managed PG CIDR
      ports:
        - {protocol: TCP, port: 5432}
---
# The static origin (Task 043, R4; ingress peer added in Task 043A).
#
# Browser -> CDN -> ingress-nginx (the TLS edge, deploy/k8s/frontend/ingress.yaml)
#            -> static -> API.
#
# The peers are the two hops that are actually in front of the document, and both
# are `namespaceSelector`s. A bare `podSelector` would match pods in THIS
# namespace, so a peer written that way admits the API, the workers and anything
# an attacker can schedule - which for the origin means every workload in the
# deployment.
#
# Task 043 had no `ingress-nginx` peer and reached the origin over the provider's
# private link. Task 043A requires a TLS-terminating ingress for the frontend
# host, and the way to satisfy that without opening a second public route is to
# make the ingress the ORIGIN-side hop rather than an additional one: the Service
# is still ClusterIP, the ingress answers the CDN's origin hostname rather than
# the public one, and the CDN remains the only browser-reachable name. Two peers
# here, not one more public route.
#
# If the CDN's proxy is not in the `cdn-edge` namespace and the controller is not
# in `ingress-nginx`, this policy denies everything and the symptom is a 503 at
# the edge - which is the correct direction to fail in.
#
# Egress: none. A static file server that serves a build has nothing to call.
---
# The backup job (Task 047): PostgreSQL and object storage, nothing else.
#
# The migration-allow policy above is the template and the reason this one exists:
# before Task 047 the backup CronJob did not exist, and when it was added it
# inherited the default-deny with no rule of its own - which means it could not
# have reached PostgreSQL at all. A backup that cannot connect produces no
# archive, and produces it silently: the Job succeeds (pg_dump against a
# filtered-to-nothing view, or the CronJob never even starts) and there is
# nothing to notice until a restore is needed.
#
# Egress is the whole of its job: read the database (5432), write the archive to
# the versioned bucket (9000 self-hosted MinIO, 443 for a managed endpoint).
# No ingress rule at all, for the migration Job's reason: nothing connects to a
# pod that is copying a database, and a backup pod that accepts a connection is
# a pod someone can ask what it is holding.
#
# It is NOT granted the broker, Redis, or the provider egress on 443 that the
# workers hold. It has no reason to publish a message and no reason to call an
# AI provider, and a backup job is exactly the kind of long-lived, low-urgency
# process an over-broad egress rule is used to smuggle.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-allow
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
  annotations:
    task-047: "PostgreSQL + object storage only; no ingress; no broker, no provider egress"
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: backup}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: postgres}}
        - ipBlock: {cidr: 198.51.100.0/24} # CHANGE_ME: managed PG CIDR
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector: {matchLabels: {app: minio}}
        - ipBlock: {cidr: 198.51.100.0/24} # CHANGE_ME: managed storage CIDR
      ports:
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 443}
---
# The datestores have to ACCEPT the backup job, and this policy is the only
# reason they do.
#
# A NetworkPolicy is symmetric: `backup-allow` granting egress does not open the
# database's ingress, and the default-deny above closes it. Without this rule
# the job cannot connect. That asymmetry is invisible in a manifest review
# because each file looks locally correct, and the symptom is a CronJob that
# fails with a connection timeout rather than with anything that says "the
# network policy does not permit this" - which is gap D8 in docs/backup.md.
#
# The migration job has the SAME missing half and it is deliberately NOT fixed
# here: widening the reach of the one workload that can DDL is a security change
# with its own review, it is pre-existing, and it is recorded as a gap with an
# owner rather than being fixed inside a backup task. This rule names the backup
# component alone; `deploy/tests/hosting-topology.py` allows exactly this one
# extra peer and fails on any other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: datastores-allow-backup
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
  annotations:
    task-047: "the half of the policy that lets the backup job be dialled at all"
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/component: backup}}
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: static-allow
  namespace: dubbing-prod
  labels:
    app.kubernetes.io/part-of: dubbing-platform
  annotations:
    task-043: "CDN -> static origin only; no egress"
    task-043a: "ingress-nginx added as the TLS-terminating origin-side hop"
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: static}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {name: cdn-edge}}
        - namespaceSelector: {matchLabels: {name: ingress-nginx}}
      ports:
        - {protocol: TCP, port: 8080}

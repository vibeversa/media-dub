# Security headers, as an include (Task 043).
#
# WHY THIS IS A SEPARATE FILE
# ---------------------------
# nginx's `add_header` does NOT merge. A `location` block that declares any
# `add_header` of its own DISCARDS every `add_header` inherited from the enclosing
# `server` block and uses only its own. That is not documented as a caveat, it is
# simply how the directive works, and it produces the following very ordinary
# configuration:
#
#   server {
#     add_header X-Frame-Options "DENY" always;      # set here
#     location /assets/ {
#       add_header Cache-Control "immutable" always; # ...and DROPPED here
#     }
#   }
#
# Every asset response then ships with no `X-Frame-Options`, no CSP and no
# `nosniff`, and the server block looks correct in review. This file is the
# include every such block uses, so there is one copy of the header set and no
# block can silently opt out of it.
#
# The alternative — repeating the four headers in all seven location blocks — was
# written first and rejected: it is six extra copies that drift, and a reviewer
# comparing two blocks finds no difference rather than finding the one that is
# missing a header.
#
# `always` on every one. Without it nginx omits the header on error responses
# (404, 502), which is exactly when a scanner reports it missing and when the
# response a user sees is the one that matters.
#
# BYTE-FOR-BYTE IDENTICAL to `SecurityHeadersMiddleware` on the API (Task 037),
# and asserted to be by `compareSecurityHeaders` in tools/hosting-policy.mjs. A
# stricter static origin and a looser API is not "the API is internal": the weaker
# of the two is what a browser enforces.
#
# Strict-Transport-Security is deliberately NOT here. It is a per-origin,
# browser-cached, irreversible-for-max-age commitment, and this origin terminates
# no TLS — the CDN does. The header belongs in the CDN's viewer-request function
# (deploy/cdn/viewer-request.security-headers.js), set once for the public
# hostname. Setting it here would commit browsers to a policy about a hostname
# whose certificate this origin does not hold.
#
# `connect-src 'self'` is the API's own policy, kept rather than widened to the
# configured API origin: the API's CORS layer governs cross-origin access, and a
# static `connect-src` permitting any origin would undo it from the other side.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

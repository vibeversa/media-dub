# nginx site configuration for the frontend image (Task 042).
#
# Two rules carry the whole file, and both exist because getting them wrong
# produces a bug that only appears after a deploy:
#
#   1. index.html is NEVER cached. It names the current hashed asset filenames, so
#      a cached copy points at assets that the next deploy has already replaced.
#      The symptom is a white screen on every hard refresh after a release.
#   2. /assets/ is immutable. Those filenames contain a content hash, so the
#      bytes behind a given name never change, and a year-long cache is safe.
#
# Between those two, every browser request pattern is correct: the document is
# always fresh, the heavy immutable files are fetched once.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The client router owns every path. A deep link such as
    # /projects/01HZY.../workspace has never been seen by the server, so without
    # this the user gets a 404 that no amount of client-side routing can fix.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The document itself. `no-cache` rather than `no-store`: the browser may keep
    # a copy, it must revalidate, and a conditional request that 304s is free.
    # `no-store` would also break the back/forward cache for no benefit.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # Hashed build output. Immutable for a year: the name changes when the bytes
    # change, so a stale entry can never be served.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Vite's non-hashed outputs. Cached briefly rather than never, so a rollout
    # that changes one of these reaches browsers without a hard refresh.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|json|txt|webmanifest)$ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # The service worker must never be served from a cache, or a client can be
    # pinned to an old asset manifest indefinitely - the same class of failure as
    # a cached index.html, one layer deeper and much harder to diagnose.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Source maps are not shipped. `frontend/vite.config.ts` sets
    # `build.sourcemap: false` for the same reason, so this is the second line of
    # defence rather than the only one: a source map published by accident is a
    # published copy of the application source.
    location ~* \.map$ {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Never echo a request that carried a credential. A reflected URL is how a
    # presigned token ends up in an access log on a shared CDN.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}

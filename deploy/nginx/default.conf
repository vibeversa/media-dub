# nginx site configuration for the frontend image (Task 042, hardened in 043).
#
# WHAT THIS FILE IS
# -----------------
# The static origin's half of the hosting policy, and the authoritative
# implementation of it. `deploy/cdn/origin.json` declares the same rules as data
# so a second reader can check them; `tools/hosting-policy.mjs` validates the
# data; `deploy/tests/hosting.test.sh` starts THIS image and asserts the headers
# that actually come back. The config is authoritative because it is what the
# image runs; the JSON exists to be checked against it, not to be believed.
#
# FOUR THINGS IN HERE THAT ONLY MATTER AFTER A DEPLOY
# --------------------------------------------------
#   1. index.html is NEVER cached. It names the current hashed asset filenames,
#      so a cached copy points at assets the next deploy has already replaced.
#      The symptom is a white screen on every hard refresh after a release, and
#      it is the most common way a hashed-asset setup fails in production.
#   2. /assets/ is immutable for a year. Those filenames carry a content hash, so
#      the bytes behind a name never change and a stale entry cannot exist.
#   3. A MISSING hashed asset is a 404, never the document. `try_files $uri
#      =404` in the assets block, deliberately NOT `/index.html`. Serving the
#      document for a missing chunk gives the browser 200 text/html where it
#      expected JavaScript, and the resulting SyntaxError names the frontend
#      rather than the CDN - which is where the investigation goes, and wrongly.
#   4. /api/ is a 404 here. The API is a separate host behind a separate
#      ingress. If this origin answers /api/... with the SPA document, a client
#      gets 200 text/html where it expected JSON and the parse error names the
#      frontend.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- the client router owns every path -----------------------------------
    # A deep link such as /projects/01HZY.../workspace has never been seen by
    # the server, so without this the user gets a 404 that no amount of
    # client-side routing can fix.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- the health endpoint ---------------------------------------------------
    # A static 200, served by `return` from this config with no filesystem access
    # and no dependency on the build output. The deployment's liveness and
    # readiness probes both use it (deploy/k8s/frontend/deployment.yaml).
    #
    # Why a `return` and not `try_files $uri =404` against a file: the probe's job
    # is "can this process serve an HTTP response", and asking for the document
    # conflates that with "does the build output contain an index.html". A build
    # that produced no document would then be a failing readiness probe on every
    # replica, which reads as a broken cluster rather than as a broken build.
    #
    # `no-store`, never cached. A cached health response is a 200 that outlives
    # the thing it reported, which is the worst possible answer from the one
    # endpoint a monitor trusts absolutely.
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # --- the document itself -------------------------------------------------
    # `no-cache` rather than `no-store`: the browser may keep a copy, it must
    # revalidate, and a conditional request that 304s is free. `no-store` would
    # also break the back/forward cache for no benefit.
    #
    # The explicit `Cache-Control` here overrides the `/` block's, because
    # `add_header` in a more specific block REPLACES the inherited set rather
    # than adding to it. An exact-match block is therefore required for this to
    # take effect at all - which is why the class in origin.json is
    # `exactPaths: ["/index.html"]` and not a prefix.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        # `add_header` replaces the inherited set, so the security headers must be
        # re-included here. See deploy/nginx/security-headers.conf for why this is
        # an include and not a repeated block.
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        try_files $uri =404;
    }

    # --- the runtime version document ---------------------------------------
    # Served from the same deployment as the bundle it describes (deploy/
    # config-inject.sh writes it into the build output), and never cached: its
    # entire job is to report what the CDN is CURRENTLY serving, and a cached
    # copy answers yesterday's question. The client compares it against the tag
    # baked into the running bundle to detect a stale tab (Task 043).
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        try_files $uri =404;
    }

    # --- hashed build output --------------------------------------------------
    # Immutable for a year: the name changes when the bytes change, so a stale
    # entry can never be served. `=404` rather than the SPA fallback - see
    # point 3 in the header.
    #
    # `^~` and not a bare prefix, and that is load-bearing. nginx evaluates
    # regex locations in order and a regex match WINS over a plain prefix match,
    # so without `^~` a request for `/assets/index-Ab12.js` would be handled by
    # the `\.(js|css|…)$` regex below and get `max-age=300` - a mutable cache
    # header on a content-hashed name, which means a browser revalidates an asset
    # whose bytes never change and a CDN that evicts it re-fetches it for every
    # user. `^~` stops the regex search for anything under /assets/.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # `add_header` REPLACES the inherited set rather than adding to it, so
        # this include is required here. Without it every asset response ships
        # with no CSP, no nosniff and no frame denial. See
        # deploy/nginx/security-headers.conf.
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # --- Vite's non-hashed outputs --------------------------------------------
    # Cached briefly rather than never, so a rollout that changes one of these
    # reaches browsers without a hard refresh. These names do NOT change with
    # content, which is exactly why a year would be wrong for them.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|json|txt|webmanifest)$ {
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # --- the service worker ----------------------------------------------------
    # Never served from a cache, or a client can be pinned to an old asset
    # manifest indefinitely - the same class of failure as a cached index.html,
    # one layer deeper and much harder to diagnose.
    #
    # Declared as an exact match so it beats the `\.(js|…)$` regex above, which
    # would otherwise give the service worker a five-minute cache.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # --- source maps are not shipped ------------------------------------------
    # `frontend/vite.config.ts` sets `build.sourcemap: false` for the same reason,
    # so this is the second line of defence rather than the only one: a source map
    # published by accident is a published copy of the application source.
    location ~* \.map$ {
        return 404;
    }

    # --- the API is not served here ---------------------------------------------
    # Point 4 in the header. Without this block the `location /` fallback answers
    # every /api/... path with index.html.
    location /api/ {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    gzip on;
    gzip_vary on;
    # 1024 rather than 0: gzipping a 300-byte file makes it larger and costs CPU
    # on the hot path. The win is entirely in the large files, and a bundler
    # emits the same text repeatedly.
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # --- precompressed siblings -------------------------------------------------
    # `gzip_static` serves the `.gz` file the build wrote next to the original
    # instead of compressing on every request. The image's configure line
    # (`nginx -V`) includes `--with-http_gzip_static_module`, and the `.gz` files
    # exist because `Dockerfile.frontend` precompresses every asset larger than 4
    # KiB in the `dist` stage with node's built-in zlib - no extra dependency, and
    # the same bytes for every request instead of one compression per request.
    #
    # `gzip_static on` (not `always`) so a client that does not accept gzip still
    # gets the original, which is the correct answer and not a failure.
    #
    # The siblings live under /assets/, so they are matched by the `^~ /assets/`
    # block above and inherit its immutable Cache-Control. That is why only assets
    # are precompressed: a `.gz` of index.html would be served by `location /`,
    # which declares no Cache-Control at all.
    gzip_static on;

    # --- WHY THERE IS NO `brotli on;` HERE ---------------------------------------
    # This image has no brotli module. `nginxinc/nginx-unprivileged:1.27-alpine`
    # is configured `--with-http_gzip_static_module --with-http_v2_module
    # --with-http_v3_module` and NOT `--with-http_brotli_module`; `nginx -V`
    # against the image is where that was established, and writing `brotli on;`
    # here would stop the container from starting at all with
    # `unknown directive "brotli"`.
    #
    # Brotli is negotiated at the EDGE, which is the right place for it anyway: the
    # edge caches one representation per Accept-Encoding and revalidates against
    # the origin far less often than a browser does. The build still emits `.br`
    # siblings (Dockerfile.frontend, same zlib call) so a CDN configured for
    # Brotli can serve them without compressing anything. See
    # deploy/cdn/origin.json `compression` and deploy/frontend/README.md.

    # --- security headers -------------------------------------------------------
    # The set lives in deploy/nginx/security-headers.conf and is `include`d by
    # every block that declares an `add_header` of its own. Declaring it here as
    # well is deliberate and harmless: a location with no `add_header` inherits
    # this one, so `location /` is covered either way, and having the server-level
    # copy means a new block added without the include still gets a default
    # rather than nothing.
    #
    # A block that DOES declare its own `add_header` gets only that one, which is
    # why the include is repeated in each of them. That is nginx's behaviour, not
    # an oversight, and it is the single easiest way to ship a static origin with
    # no CSP on its asset responses.
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}

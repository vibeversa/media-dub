name: CI

# Task 042 - the aggregator.
#
# WHY THIS FILE EXISTS
# --------------------
# Three pipelines (`backend`, `frontend`, `contract`) are three separate required
# checks. If each of them also triggered on `pull_request` in their own right, a
# single PR would run every job twice and the checks list would be six entries
# long with two of each name - which is a merge-blocking configuration nobody
# reads.
#
# So the three are `workflow_call` targets and THIS is the only thing that
# subscribes to events. One run, three named jobs, three required checks:
#
#   CI / backend
#   CI / frontend
#   CI / contract
#
# It also replaces the Task 40 `ci.yml`, which ran its own build/unit/integration/
# e2e/docker jobs alongside these. That was a second publish path for the same
# eight images under the same tags; two workflows pushing `dubbing-api:<sha>` to
# the same registry is a race nobody would have noticed until a deploy pulled a
# half-written layer. Everything that file did is in `backend.yml` or
# `frontend.yml`; the migration is listed in docs/ci-branch-protection.md.
#
# MIGRATION NOTE FOR THE FIRST PUSH
# ---------------------------------
# The old `CI / build + unit`, `CI / integration + contract`, `CI / e2e smoke` and
# `CI / container build/scan/sbom/sign/publish` checks disappear. Replace them in
# the branch-protection required list with the three names above BEFORE merging the
# first PR that adds this file, or the PR waits on checks that no longer run.
#
# PERMISSIONS
# -----------
# Top level `contents: read` and nothing else. Every job that needs more (GHCR
# push, cosign keyless, SARIF upload) declares the extra permission itself, so a
# job that is added later without thinking about it cannot inherit write access
# to the registry. `secrets: inherit` passes the repository secrets - which is the
# documented bootstrap set, all of them GitHub-issued - down to the three
# pipelines. There is no cloud credential in this repository.

on:
  push:
    branches: [main]
    # A version tag is a release: the pipelines that publish run on it, and their
    # own guards (R5) refuse to publish anything that is not `v<major>.<minor>.<patch>`.
    # Tags are declared HERE rather than on the pipelines themselves, because a
    # reusable workflow's own triggers are ignored when it is called - only the
    # caller's triggers apply.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract:
    name: contract
    # FIRST, and not because it is cheap. The contract gate's inputs are two git
    # refs, so it reaches a verdict in about a minute. Running it in parallel with
    # the builds would still work, but running it first means a breaking API
    # change is reported while a developer is still looking at the run, instead of
    # ten minutes later behind a build that was never going to matter.
    uses: ./.github/workflows/contract.yml
    secrets: inherit

  backend:
    name: backend
    needs: contract
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  frontend:
    name: frontend
    # The frontend pipeline does not depend on the backend one. They share no
    # build output, no database and no contract artefact - the only thing they
    # share is the checkout - and serialising them would double the wall clock of
    # every PR for no correctness gain.
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

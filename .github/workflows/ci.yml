name: CI

# Task 40 pipeline: restore -> build -> unit -> integration -> contract ->
# E2E-smoke -> container-build -> scan -> SBOM -> sign -> publish.
# Fail on warnings; NuGet and Docker layers cached.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: ghcr.io
  # TreatWarningsAsErrors is also enforced by Directory.Build.props; the
  # explicit flag below keeps the intent visible in CI logs.
  WARN_AS_ERROR: /p:TreatWarningsAsErrors=true

jobs:
  build:
    name: build + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build (fail on warnings)
        run: dotnet build --no-restore --warnaserror ${{ env.WARN_AS_ERROR }}

      - name: Unit tests
        run: dotnet test tests/DubbingPlatform.UnitTests --no-build --nologo -v q

  api-contract:
    name: api-contract + frontend
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        run: npm ci --prefix frontend

      - name: API drift gate (fails when stale)
        run: make check-api-drift

      - name: Seed example env for the build gate (Task 015 R5)
        run: cp frontend/.env.example frontend/.env

      - name: Frontend build (prebuild re-checks drift, strict tsc)
        run: npm run build --prefix frontend

      - name: OpenAPI coverage tests
        run: dotnet test tests/DubbingPlatform.IntegrationTests --nologo -v q --filter "FullyQualifiedName~OpenApiCoverageTests"

  integration:
    name: integration + contract
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install FFmpeg (fixture probes, MediaBomb/Signal tiers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate fixtures
        run: bash scripts/generate-fixtures.sh

      # Testcontainers (PostgreSQL 16, RabbitMQ 3.13, Redis 7, MinIO) spins
      # its own containers; the ubuntu-latest Docker daemon is required.
      - name: Integration tests (Soak excluded; run via RUN_SOAK=1 nightly)
        run: dotnet test tests/DubbingPlatform.IntegrationTests --nologo -v q --filter "Category!=Soak"

      - name: Contract tests
        run: dotnet test tests/DubbingPlatform.ContractTests --nologo -v q

  e2e:
    name: e2e smoke (FullPipeline)
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate fixtures
        run: bash scripts/generate-fixtures.sh

      - name: E2E smoke (FullPipeline only)
        run: dotnet test tests/DubbingPlatform.E2ETests --nologo -v q --filter "FullyQualifiedName~FullPipelineTests"

  docker:
    name: container build/scan/sbom/sign/publish
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: true
      matrix:
        include:
          - dockerfile: Dockerfile.api
            image-suffix: dubbing-api
          - dockerfile: Dockerfile.worker.control
            image-suffix: dubbing-worker-control
          - dockerfile: Dockerfile.worker.media.preparation
            image-suffix: dubbing-worker-media-preparation
          - dockerfile: Dockerfile.worker.media.render
            image-suffix: dubbing-worker-media-render
          - dockerfile: Dockerfile.worker.ai
            image-suffix: dubbing-worker-ai
          - dockerfile: Dockerfile.worker.gpu
            image-suffix: dubbing-worker-gpu
          - dockerfile: Dockerfile.worker.export
            image-suffix: dubbing-worker-export
          - dockerfile: Dockerfile.maintenance
            image-suffix: dubbing-maintenance
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (main pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name (lowercase owner required by GHCR)
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${owner}/${{ matrix.image-suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image-suffix }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image-suffix }}.sarif
          category: trivy-${{ matrix.image-suffix }}

      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.image-suffix }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image-suffix }}
          path: sbom-${{ matrix.image-suffix }}.spdx.json
          retention-days: 90

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
